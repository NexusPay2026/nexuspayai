[pytest]
# Async tests run without a per-test decorator.
asyncio_mode = auto
# Each test (and its async fixtures) gets its own event loop; the per-test DB
# engine is created and disposed inside that loop, so asyncpg connections never
# leak across loops.
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
addopts = -ra -q
filterwarnings =
    ignore::DeprecationWarning
